# Shared standards; replace main with the reviewed exact release's full SHA (CARD-04).
name: Check
'on':
  push: null
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    uses: eigger/hass-repo-standards/.github/workflows/card-check.yml@main
    with:
      node-version: '22'
      check-script: check
      test-script: test
      # Set build-script (and keep bundle-path) for cards built from source.
      build-script: ''
      bundle-path: example-card.js
