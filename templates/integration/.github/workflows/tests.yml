# Shared standards; upstream action SHAs verified 2026-10-17.
name: Tests
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# This example tests current HA; it does not declare or raise minimum support.
# Add/keep a separate minimum-ha job when hacs.json declares an older HA.
# Use that exact HA, a compatible Python/plugin pair, and separate requirements.
jobs:
  current:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@main
    with:
      # Replace main with the same reviewed full SHA as this reusable workflow.
      standards-ref: main
      domain: example
      python-versions: '["3.14"]'
      requirements: requirements_test.txt
      expected-ha-version: '2026.10.2'
      test-profile: ha
      pytest-args: tests/components/example/ -v
