# Shared standards; upstream action SHAs verified 2026-10-17.
name: Update manifest dependencies
'on':
  workflow_call:
    inputs:
      domain:
        description: Integration domain
        required: true
        type: string
      packages:
        description: JSON array, e.g. ["imagespec", "blesession"]
        required: true
        type: string
      python-version:
        description: Python compatible with test environment
        required: true
        type: string
      requirements:
        description: Caller test requirements
        required: false
        type: string
        default: requirements_test.txt
      lint-requirements:
        description: Caller lint requirements
        required: false
        type: string
        default: requirements_lint.txt
      ha-components:
        description: Space separated HA component names
        required: false
        type: string
        default: ''
      test-profile:
        description: unit or ha
        required: false
        type: string
        default: unit
      standards-ref:
        description: Reviewed full central SHA for installed payload contract (imagespec HA only)
        required: false
        type: string
        default: ''
      validation-command:
        description: Trusted command covering changed package behavior
        required: true
        type: string
      allow-major:
        description: Allow explicitly reviewed major version update
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: manifest-dependencies-${{ github.repository }}
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: ${{ inputs.python-version }}
    - name: Read actual default branch
      id: repository
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)

        printf ''branch=%s\n'' "$branch" >> "$GITHUB_OUTPUT"'
    - name: Check out default branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ steps.repository.outputs.branch }}
        persist-credentials: false
    - id: update
      uses: eigger/hass-repo-standards/actions/update-manifest@8e7b3b415dbdb8960ef5b2689c981d99fc8b0028 # validated updater implementation
      with:
        domain: ${{ inputs.domain }}
        packages: ${{ inputs.packages }}
        allow-major: ${{ inputs.allow-major }}
    - if: steps.update.outputs.updated == 'true'
      uses: eigger/hass-repo-standards/actions/python-environment@d5dcaa03cfe91923a5ca2fe0ab79595b222eb90e # validated environment implementation
      with:
        domain: ${{ inputs.domain }}
        python-version: ${{ inputs.python-version }}
        requirements: ${{ inputs.requirements }}
        ha-components: ${{ inputs.ha-components }}
        test-profile: ${{ inputs.test-profile }}
        dependency-mode: minimum
        minimum-packages: ${{ inputs.packages }}
    - name: Detect documented payload contract
      id: payload
      if: steps.update.outputs.updated == 'true'
      env:
        DOMAIN: ${{ inputs.domain }}
        TEST_PROFILE: ${{ inputs.test-profile }}
        STANDARDS_REF: ${{ inputs.standards-ref }}
      run: |
        python - <<'PAYLOAD'
        import ast, json, os, re
        from pathlib import Path
        from packaging.requirements import Requirement
        from packaging.utils import canonicalize_name
        needed = False
        active = False
        root = Path.cwd()
        if os.environ["TEST_PROFILE"] == "ha":
            component = root / "custom_components" / os.environ["DOMAIN"]
            manifest = json.loads((component / "manifest.json").read_text())
            selected = [Requirement(r) for r in manifest.get("requirements", []) if canonicalize_name(Requirement(r).name) == "imagespec"]
            needed = bool(selected)
            active = any(r.marker is None or r.marker.evaluate() for r in selected)
            if not needed:
                for path in component.rglob("*.py"):
                    if not path.resolve().is_relative_to(root):
                        raise ValueError("Integration source escapes caller checkout")
                    tree = ast.parse(path.read_text(), filename=str(path))
                    for node in ast.walk(tree):
                        if isinstance(node, ast.Import) and any(a.name.split(".")[0] == "imagespec" for a in node.names):
                            needed = active = True
                        if isinstance(node, ast.ImportFrom) and node.level == 0 and (node.module or "").split(".")[0] == "imagespec":
                            needed = active = True
        if active:
            standards_ref = os.environ["STANDARDS_REF"]
            if not standards_ref and (root / ".hass-standards.json").is_file():
                config = json.loads((root / ".hass-standards.json").read_text())
                if config.get("standards_update") == {"provider": "dependabot", "workflow": "update_standards.yml"}:
                    descriptor = config["standards"]
                    if descriptor.get("kind") != "release" or not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", descriptor.get("tag", "")):
                        raise ValueError("Metadata-backed tools require an exact release")
                    standards_ref = descriptor["resolved_sha"]
            if not re.fullmatch(r"[0-9a-f]{40}", standards_ref):
                raise ValueError("imagespec HA validation requires the reviewed full standards-ref SHA")
            reserved = root / ".hass-standards-tools"
            if reserved.exists() or reserved.is_symlink():
                raise ValueError("Reserved standards tooling path exists; preserve caller files and choose an approved migration")
        with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
            stream.write("required=" + str(needed).lower() + "\n")
            stream.write("active=" + str(active).lower() + "\n")
            if active:
                stream.write("standards-ref=" + standards_ref + "\n")
        if needed and not active:
            print("N/A: imagespec marker inactive in this matrix; ordinary regression continues, no payload version coverage is claimed")
        PAYLOAD
    - name: Check out reviewed payload tools separately
      if: steps.payload.outputs.active == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: eigger/hass-repo-standards
        ref: ${{ steps.payload.outputs.standards-ref }}
        path: .hass-standards-tools
        persist-credentials: false
    - name: Validate installed payload examples
      if: steps.payload.outputs.active == 'true'
      run: test "${{ steps.payload.outputs.standards-ref }}" = "$(git -C .hass-standards-tools rev-parse HEAD)"
    - name: Run installed payload examples
      if: steps.payload.outputs.active == 'true'
      uses: ./.hass-standards-tools/actions/check-payload
      with:
        domain: ${{ inputs.domain }}
    - name: Remove temporary standards tooling checkout
      if: steps.payload.outputs.active == 'true'
      run: |
        python - <<'CLEAN'
        from pathlib import Path
        import shutil
        path = Path.cwd() / ".hass-standards-tools"
        if path.is_symlink() or path.resolve() != Path.cwd() / ".hass-standards-tools":
            raise ValueError("Refuse to remove a changed tooling path")
        shutil.rmtree(path)
        CLEAN
    - name: Validate proposed dependency changes
      if: steps.update.outputs.updated == 'true'
      env:
        VALIDATION_COMMAND: ${{ inputs.validation-command }}
        LINT_REQUIREMENTS: ${{ inputs.lint-requirements }}
        PAYLOAD_CONTRACT: ${{ steps.payload.outputs.required }}
        DOMAIN: ${{ inputs.domain }}
      run: |
        python -m pip install -r "$LINT_REQUIREMENTS"
        python -m pip check
        if [ "$PAYLOAD_CONTRACT" = "true" ]; then
          export PYTEST_ADDOPTS="${PYTEST_ADDOPTS:-} --ignore=tests/components/$DOMAIN/test_payload_examples.py"
        fi
        bash -euo pipefail -c "$VALIDATION_COMMAND"
    - name: Create or update one dependency PR
      # Also synchronize an existing PR when no change remains. The default
      # success() guard still prevents this step after update/validation failures.
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
      with:
        token: ${{ github.token }}
        base: ${{ steps.repository.outputs.branch }}
        branch: bot/manifest-dependencies
        delete-branch: true
        add-paths: custom_components/${{ inputs.domain }}/manifest.json
        title: 'chore: update manifest dependencies'
        commit-message: 'chore: update manifest dependencies'
        body-path: ${{ runner.temp }}/hass-dependency-update.md
