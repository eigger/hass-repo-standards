# Shared standards for dashboard card repositories (CARD-04); action SHAs verified 2026-11-07.
name: Card check
'on':
  workflow_call:
    inputs:
      node-version:
        description: Node.js major version (minimum of the card's engines.node range)
        required: false
        type: string
        default: '22'
      check-script:
        description: npm script for syntax checks; check-script or lint-script is required
        required: false
        type: string
        default: check
      lint-script:
        description: npm script for lint; check-script or lint-script is required
        required: false
        type: string
        default: ''
      test-script:
        description: npm script for tests (required)
        required: false
        type: string
        default: test
      build-script:
        description: npm script that builds the bundle; empty for cards without a build
        required: false
        type: string
        default: ''
      bundle-path:
        description: Repository-relative bundle path that must exist after the optional build
        required: true
        type: string
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate inputs
        env:
          NODE_VERSION: ${{ inputs.node-version }}
          CHECK: ${{ inputs.check-script }}
          LINT: ${{ inputs.lint-script }}
          TEST: ${{ inputs.test-script }}
          BUILD: ${{ inputs.build-script }}
          BUNDLE_PATH: ${{ inputs.bundle-path }}
        run: |
          [[ "$NODE_VERSION" =~ ^[0-9]+$ ]] || { echo "node-version must be a major number"; exit 1; }
          [ -n "$CHECK$LINT" ] || { echo "check-script or lint-script is required (CARD-04)"; exit 1; }
          [ -n "$TEST" ] || { echo "test-script is required (CARD-04)"; exit 1; }
          for script in "$CHECK" "$LINT" "$TEST" "$BUILD"; do
            [ -z "$script" ] || [[ "$script" =~ ^[A-Za-z0-9][A-Za-z0-9:_-]*$ ]] || { echo "invalid npm script name"; exit 1; }
          done
          [[ "$BUNDLE_PATH" =~ ^[A-Za-z0-9._/-]+$ && "$BUNDLE_PATH" != /* && "$BUNDLE_PATH" != .* && "$BUNDLE_PATH" != */.* && "$BUNDLE_PATH" != *..* && "$BUNDLE_PATH" != */ ]] || { echo "bundle-path must be a safe relative path"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - name: Check
        if: inputs.check-script != ''
        env:
          SCRIPT: ${{ inputs.check-script }}
        run: npm run "$SCRIPT"
      - name: Lint
        if: inputs.lint-script != ''
        env:
          SCRIPT: ${{ inputs.lint-script }}
        run: npm run "$SCRIPT"
      - name: Test
        if: inputs.test-script != ''
        env:
          SCRIPT: ${{ inputs.test-script }}
        run: npm run "$SCRIPT"
      - name: Build
        if: inputs.build-script != ''
        env:
          SCRIPT: ${{ inputs.build-script }}
        run: npm run "$SCRIPT"
      - name: Assert bundle exists
        env:
          BUNDLE_PATH: ${{ inputs.bundle-path }}
        run: test -f "$BUNDLE_PATH" && test -s "$BUNDLE_PATH"
