name: Audit standards consumers
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - run: python -m pip install -r actions/check-standards/requirements.txt
      - run: python scripts/audit_standards_consumers.py
        env:
          GH_TOKEN: ${{ github.token }}
